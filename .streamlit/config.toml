# Judge-facing deployment. The dashboard is read-only and holds no provider
# credentials: it reads recorded evidence.
[server]
headless = true
# enableCORS = false makes Streamlit send Access-Control-Allow-Origin: * and
# does not actually restrict WebSocket origins, so it weakens the app for no
# benefit. The dashboard is read-only and serves no cross-origin caller.
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

# Set the theme here rather than fighting it with !important in a stylesheet.
# The palette is semantic: cool primary for values deterministic code owns,
# amber elsewhere in CSS for anything the model touched.
[theme]
base = "dark"
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#151B23"
textColor = "#E7EDF5"
primaryColor = "#5AB3F0"
font = "sans serif"
