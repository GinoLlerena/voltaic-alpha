# Options Alpha: unattended security upgrades on trading-day mornings only.
#
# An upgrade can restart PostgreSQL and the worker (needrestart). On 30 Sep it
# did so at 22:01 UTC, four minutes after a boot, during the hourly backup's
# restore check. 08:50 ET is after the scheduled start (08:30-08:45 ET) and its
# boot-time backup, finishes well before the 09:00 ET backup, and leaves 40
# minutes to the open. Persistent=false: a missed run is not caught up at boot.
[Timer]
OnCalendar=
OnCalendar=Mon..Fri 08:50 America/New_York
RandomizedDelaySec=0
Persistent=false
