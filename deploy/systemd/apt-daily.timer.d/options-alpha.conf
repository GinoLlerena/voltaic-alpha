# Options Alpha: package-list downloads on trading-day mornings only.
#
# The scheduled stop (design §6) keeps the server off outside 08:30-17:30 ET,
# so Ubuntu's default times (06:00/18:00 local plus up to 12 h of random delay,
# Persistent=true) are mostly missed and then caught up at the next boot, where
# they race the boot-time backup. A fixed slot after the boot and before the
# 09:00 ET backup avoids that. Persistent=false: a missed run is not caught up.
[Timer]
OnCalendar=
OnCalendar=Mon..Fri 08:47 America/New_York
RandomizedDelaySec=0
Persistent=false
