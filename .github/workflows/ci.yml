name: CI

# Clean-checkout gate for Phase 1: a fresh clone must lint, type-check, replay the
# offline suite, and pass secret and dependency scans without provider credentials.
# Live provider tests are opt-in and never run here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Absent credentials are the point: nothing in CI may reach a broker or a model.
  ALPACA_TRADING_ENABLED: "false"

jobs:
  frontend:
    # RUI-2. The browser half: its types are generated from the committed
    # OpenAPI document, so this job needs no Python and no running server. A
    # separate test in the Python job proves that document still matches the API.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Tests
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Generated API types are current
        # Regenerating must be a no-op: types that describe a different contract
        # than the committed document would type-check against nothing real.
        run: |
          pnpm run api-types
          git diff --exit-code src/api/schema.ts

  browser:
    # RUI-2's gate. The unit suite runs in jsdom, which applies no stylesheet,
    # and three shipped defects proved what that misses: a palette token at
    # 3.09:1, proof tiles with no styles at all, and a cascade that painted the
    # model's stage on the decisions where the model never ran. All three had
    # correct markup and a green suite.
    #
    # This keeps the frontend job's property of needing no Python and no
    # database: it serves the built app and replays frozen API envelopes from
    # frontend/fixtures/api.json, so a failure here is always the page's fault.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        # Only Chromium, and only its dependencies: the gate asserts contrast,
        # layout and computed colour, none of which needs three engines.
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm run build
      - name: Accessibility, rendering and visual regression
        run: pnpm run e2e
      - name: Upload the report and the images this run produced
        # Always, not just on failure: a visual baseline for Linux is taken from
        # a run rather than guessed at, and a diff is unarguable in a way a
        # description of a diff is not.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-gate
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: options_alpha
          POSTGRES_PASSWORD: options_alpha
          POSTGRES_DB: options_alpha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U options_alpha -d options_alpha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://options_alpha:options_alpha@localhost:5432/options_alpha

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        # --frozen fails if uv.lock and pyproject.toml have drifted, so the
        # committed lockfile is the single source of the environment.
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Replay H0 fixtures against PostgreSQL
        # Phase 1 exit gate, proven on the real database rather than SQLite: a
        # clean checkout replays both frozen fixtures into a durable trace.
        env:
          BOT_MODE: observe
        run: uv run python -m options_alpha_lab.replay

      - name: Assert no broker write path exists
        # Parses Python rather than grepping it: a docstring explaining why we
        # never call submit_order must not count as calling it, or the guard
        # gets deleted the first time it punishes documentation.
        run: uv run python scripts/check_no_write_path.py src

      - name: Dependency audit
        run: uv run pip-audit

      - name: Secret scan
        # Tracked files only, which is the real question: has a secret reached
        # version control? --all-files would scan gitignored working files such as
        # .env and fail on credentials that are correctly excluded.
        # .secrets.baseline records reviewed non-secrets (the local Postgres
        # password and test fixtures); anything new fails the job.
        # Lockfiles are excluded on both sides for the same reason: their package
        # integrity hashes are high-entropy by construction, and baselining
        # hundreds of them would bury a real finding among them.
        run: |
          git ls-files -z \
            | grep -zvE '^(uv\.lock|frontend/pnpm-lock\.yaml|\.secrets\.baseline)$' \
            | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline
